name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  OCAML_VERSION: "4.14.2"
  UNISON_VERSION: "v2.53.8"
  OPENSSH_VERSION: "10.2p1"

jobs:
  native:
    name: native (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK (NDK ${{ env.NDK_VERSION }})
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      # Cache the pinned NDK and the host+cross OCaml toolchain together.
      # The key changes when any pin changes or a native build script is edited.
      - name: Cache NDK and OCaml toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            native/.build
          key: native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-ocaml${{ env.OCAML_VERSION }}-unison${{ env.UNISON_VERSION }}-openssh${{ env.OPENSSH_VERSION }}-${{ hashFiles('native/build-unison.sh', 'native/build-openssh.sh') }}
          restore-keys: |
            native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-ocaml${{ env.OCAML_VERSION }}-unison${{ env.UNISON_VERSION }}-openssh${{ env.OPENSSH_VERSION }}-

      - name: Cross-compile libunison.so (${{ matrix.abi }})
        run: bash native/build-unison.sh ${{ matrix.abi }}

      - name: Cross-compile openssh (${{ matrix.abi }})
        run: bash native/build-openssh.sh ${{ matrix.abi }}

      - name: Verify bundled native binaries (${{ matrix.abi }})
        run: |
          set -euo pipefail
          d=app/src/main/jniLibs/${{ matrix.abi }}
          for b in libunison.so libssh.so libssh-keygen.so libssh-keyscan.so; do
            test -f "$d/$b" || { echo "::error::missing $d/$b"; exit 1; }
          done

      - name: Upload jniLibs (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  jvm:
    name: jvm unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unit tests do not need the native binary (jniLibs is gitignored/empty).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

  app:
    name: assemble + lint
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download jniLibs (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: Download jniLibs (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-x86_64
          path: app/src/main/jniLibs/x86_64

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  e2e:
    name: e2e (x86_64 emulator)
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download jniLibs (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: Download jniLibs (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-x86_64
          path: app/src/main/jniLibs/x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
