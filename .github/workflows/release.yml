name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  OCAML_VERSION: "4.14.2"
  UNISON_VERSION: "v2.53.8"
  OPENSSH_VERSION: "10.2p1"

jobs:
  native:
    name: native (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK (NDK ${{ env.NDK_VERSION }})
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      - name: Cache NDK and OCaml toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            native/.build
          key: native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-ocaml${{ env.OCAML_VERSION }}-unison${{ env.UNISON_VERSION }}-openssh${{ env.OPENSSH_VERSION }}-${{ hashFiles('native/build-unison.sh', 'native/build-openssh.sh') }}
          restore-keys: |
            native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-ocaml${{ env.OCAML_VERSION }}-unison${{ env.UNISON_VERSION }}-openssh${{ env.OPENSSH_VERSION }}-

      - name: Cross-compile libunison.so (${{ matrix.abi }})
        run: bash native/build-unison.sh ${{ matrix.abi }}

      - name: Cross-compile openssh (${{ matrix.abi }})
        run: bash native/build-openssh.sh ${{ matrix.abi }}

      - name: Verify bundled native binaries (${{ matrix.abi }})
        run: |
          set -euo pipefail
          d=app/src/main/jniLibs/${{ matrix.abi }}
          for b in libunison.so libssh.so libssh-keygen.so libssh-keyscan.so; do
            test -f "$d/$b" || { echo "::error::missing $d/$b"; exit 1; }
          done

      - name: Upload jniLibs (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: sign and publish
    runs-on: ubuntu-latest
    needs: native
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download jniLibs (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: Download jniLibs (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-x86_64
          path: app/src/main/jniLibs/x86_64

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --print-certs app/build/outputs/apk/release/*.apk

      - name: Collect APKs
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/unisondroid-${tag}-$(basename "$apk")"
          done
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
